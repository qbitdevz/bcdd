name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test suite
        run: npm test

      - name: One-command install into a project
        env:
          BCDD_REF: ${{ github.sha }}
        run: |
          set -eu
          project="$(mktemp -d)"
          cd "$project"
          git init -q
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install.sh" | sh -s -- --with-rule
          node ~/.bcdd/pkg/install.mjs doctor
          node ~/.bcdd/pkg/install.mjs uninstall
          test ! -e AGENTS.md || ! grep -q bcdd AGENTS.md

      - name: One-command global install
        env:
          BCDD_REF: ${{ github.sha }}
        run: |
          set -eu
          cd "$HOME"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install.sh" | sh -s -- --global
          node ~/.bcdd/pkg/install.mjs doctor
          node ~/.bcdd/pkg/install.mjs uninstall --global
